services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/app/data/db.sqlite3
    volumes:
      - ./db.sqlite3:/app/data/db.sqlite3
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8002/', headers={'Host': 'tochka-nakarte.ru'}); urllib.request.urlopen(req)"]
      interval: 30s
      timeout: 10s
      retries: 3
